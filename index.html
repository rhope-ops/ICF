<script>
// Synchronous theme bootstrap: runs before styles or application content.
(()=>{const choices=['light','dark','system'];
const mobile=matchMedia('(hover: none) and (pointer: coarse)');
const defaultChoice=mobile.matches?'dark':'light';
let choice=defaultChoice;try{const saved=JSON.parse(localStorage.getItem('icf:theme'));if(choices.includes(saved))choice=saved;}catch{}
const media=matchMedia('(prefers-color-scheme: dark)');
const apply=()=>{const resolved=choice==='system'?(media.matches?'dark':'light'):choice;document.documentElement.dataset.theme=resolved;document.documentElement.style.colorScheme=resolved;document.querySelector('meta[name="theme-color"]').content=resolved==='dark'?'#121C2B':'#FFFFFF';};
window.icfTheme={defaultChoice,get choice(){return choice;},set(value){choice=choices.includes(value)?value:defaultChoice;apply();}};
apply();media.addEventListener('change',()=>{if(choice==='system')apply();});})();
</script>
